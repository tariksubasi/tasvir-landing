<link rel="canonical" href="https://app.tasvir.ai/c/6a107f12487ecb5b8f3a1653ae4185b83e42f6a50f2c7015d241018691b04e7b/1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>TYT Biyoloji · Kalıtım · Tasvir</title>
<script>
// Short links go into emails, LinkedIn messages and posts. Carry their tags on
// so the signup is still attributed: incoming utm_* pass through, ?c=NAME is a
// short campaign tag, and the site the visitor came from goes along as from.
(function () {
  var target = new URL("https://app.tasvir.ai/c/6a107f12487ecb5b8f3a1653ae4185b83e42f6a50f2c7015d241018691b04e7b/1");
  try {
    var params = new URLSearchParams(location.search);
    params.forEach(function (value, key) {
      if (key.indexOf("utm_") === 0) target.searchParams.set(key, value);
    });
    if (params.get("c") && !params.get("utm_campaign")) target.searchParams.set("utm_campaign", params.get("c"));
    if (!target.searchParams.get("utm_content")) target.searchParams.set("utm_content", "ornek-kalitim");
    target.searchParams.set("src", "short-link");
    var refHost = document.referrer ? new URL(document.referrer).hostname : "";
    if (refHost && !/(^|\.)tasvir\.ai$/.test(refHost)) target.searchParams.set("from", refHost);
  } catch (e) {}
  location.replace(target.toString());
})();
</script>
</head>

</body>
